# yachtspeed configuration. Installed at /etc/yachtspeed/config.toml.
# Secrets never go here: the AISStream key lives in /etc/yachtspeed/env (AISSTREAM_API_KEY=...).

db_path = "/var/lib/yachtspeed/yachtspeed.db"

[collector]
# AISStream format: [[lat_min, lon_min], [lat_max, lon_max]]. Pilot: Mediterranean.
# Box 1: Mediterranean (pilot). Box 2: eastern/central Atlantic incl. West Africa, Canaries,
# Cape Verde and the trade-wind route to the Caribbean (ALIBI OF LONDON was off West Africa
# in Nov 2026). Atlantic coverage is assessed separately: expect sparse offshore reports.
bounding_boxes = [[[30.0, -7.0], [46.0, 37.0]], [[0.0, -70.0], [50.0, -7.0]]]
bucket_minutes = 10
raw_samples_per_type_per_day = 20

[weather]
cell_deg = 0.1            # cache grid; Open-Meteo snaps to its own model grid anyway
settle_minutes = 90       # enrich reports once they are this old
recent_days = 2           # newer: forecast API; older: historical-forecast API
calls_per_minute = 300    # stay well under Open-Meteo free limits (600/min, 5000/h, 10000/day)
calls_per_hour = 3000
calls_per_day = 8000
enrich_interval_s = 120

[model]
min_sog_kn = 2.0
max_sog_kn = 30.0
exclude_nav_status = [1, 5, 6]   # at anchor, moored, aground
min_matches = 8
tws_tol_kn = 2.5
tws_tol_frac = 0.2
twa_tol_deg = 20.0
wave_tol_m = 0.5
voyage_gap_hours = 6.0

[report]
report_route_models = ["blend"]   # routing in the hourly report: blend = average of ecmwf, aifs, gfs, icon
report_route_res = 1.0            # forecast grid spacing for report routing (deg)

[backup]
backup_dir = "/var/lib/yachtspeed/backups"
backup_keep = 14

# Pilot fleet. Collection only starts for yachts with an MMSI.
# callsign and length_m are checked against the yacht's own AIS static broadcasts
# (yachtspeed status flags any mismatch).
[[yacht]]
name = "ALIBI OF LONDON"
model = "Oyster 885S (2013, 27.08 m, UK)"
mmsi = "235099768"
callsign = "2GQX5"
length_m = 27.0
speed_table = "oyster885_std"     # BABIANA's (885 GT) ORC VPP adjusted for the standard 885 keel
polar_factor = 0.85               # cruising allowance (crew, sails, load) until her own data calibrates it
destination = "rubicon"
verified = true
notes = "MMSI from MarineTraffic listing (name, UK flag, 27 x 6 m, call sign 2GQX5) supplied by owner 2026-11-14; confirm against her own static broadcast. Not 232059724/235088205/228481000 (other ALIBIs, ~12 m)."

